# Cloud Build pipeline for NoticeReply.
#
# Trigger: GitHub push to main.
# Result: Docker image built, pushed to Artifact Registry, deployed to Cloud Run.
#
# Required substitutions (set in the trigger):
#   _REGION            us-central1
#   _SERVICE           noticereply
#   _AR_REPO           noticereply       (Artifact Registry repo)
#   _CLOUDSQL_INSTANCE <PROJECT>:<REGION>:noticereply
#   _SERVICE_ACCOUNT   noticereply-runner@<PROJECT>.iam.gserviceaccount.com
#
# Required secrets (Secret Manager, with Cloud Build access):
#   DATABASE_URL                 — postgres://app:<pwd>@/noticereply?host=/cloudsql/<INSTANCE>
#   FIREBASE_SERVICE_ACCOUNT     — JSON for Firebase Admin
#   ANTHROPIC_API_KEY
#   RESEND_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_FOUNDING / STANDARD / PRO
#   LOB_API_KEY
#   GOOGLE_OAUTH_CLIENT_ID / CLIENT_SECRET / REFRESH_TOKEN
#   GMAIL_INBOX_USER
#   CRON_SECRET

substitutions:
  _REGION: us-central1
  _SERVICE: noticereply
  _AR_REPO: noticereply

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build the image. Public Firebase keys + apex URL are inlined at build
  #    time (Next.js inlines NEXT_PUBLIC_*).
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=https://noticereply.com
      - --build-arg
      - NEXT_PUBLIC_APP_URL=https://noticereply.com
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - .

  # 2. Push the image.
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

  # 3. Deploy to Cloud Run with Cloud SQL Auth Proxy mounted.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,STRIPE_PRICE_FOUNDING=STRIPE_PRICE_FOUNDING:latest,STRIPE_PRICE_STANDARD=STRIPE_PRICE_STANDARD:latest,STRIPE_PRICE_PRO=STRIPE_PRICE_PRO:latest,LOB_API_KEY=LOB_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,GOOGLE_OAUTH_REFRESH_TOKEN=GOOGLE_OAUTH_REFRESH_TOKEN:latest,GMAIL_INBOX_USER=GMAIL_INBOX_USER:latest,CRON_SECRET=CRON_SECRET:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest

timeout: 1800s
